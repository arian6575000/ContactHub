name: Extract ZIP in Repository Root

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that a ZIP exists
        run: test -n "$(ls ./*.zip 2>/dev/null)"

      - name: Remove previous project files
        run: find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name '*.zip' -exec rm -rf {} +

      - name: Extract ZIP
        run: unzip -o ./*.zip -d . -x ".github/*" "__MACOSX/*" && rm -f ./*.zip

      - name: Check project files
        run: test -f package.json && test -f package-lock.json && test -f app.json

      - name: Commit extracted files
        run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && (git diff --cached --quiet || git commit -m "Replace project from ZIP") && git push

      - name: Start the APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-apk.yml --ref "${{ github.ref_name }}"
