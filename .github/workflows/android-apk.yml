name: Build ContractHub APK

on:
  push:
    branches: [main]
    paths: ['package.json', 'app.json', 'src/**', 'tests/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests (data layer, sync, PDF)
        run: npm test

  apk:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Optional repository secret — enables "Sign in with Google" in the built APK (see README).
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create placeholder icons if assets/ has none
        run: node scripts/make-icons.mjs

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Optional: use one fixed signing key so the APK signature (SHA-1) never changes between builds.
      - name: Use fixed keystore (if provided)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > android/app/debug.keystore; echo "Using fixed keystore"; fi

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Dorg.gradle.jvmargs="-Xmx3g"

      - name: Re-sign APK with v1+v2+v3
        run: APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1) && "$APKSIGNER" sign --ks android/app/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true android/app/build/outputs/apk/release/app-release.apk && "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContractHub-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish APK as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ContractHub APK #${{ github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk
